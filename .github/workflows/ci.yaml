name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint:ci

  validate-content:
    name: Validate Content
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm validate:content

  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check

  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: [lint, validate-content, check]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

      - name: Upload preview version
        id: upload
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload 2>&1 | tee wrangler-output.txt
          url="$(grep -oP 'Version Preview URL:\s*\K\S+' wrangler-output.txt | head -n1 || true)"
          if [ -z "$url" ]; then
            echo "::error::Could not find a preview URL in the wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const comment = require("./.github/scripts/comment-preview-url.cjs");
            await comment({ github, context, core });

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, validate-content, check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Adopt-a-cell's secrets, from GitHub secrets of the same names, so nobody needs the
      # Cloudflare login to set them. Only the ones set in GitHub are sent; the rest are left
      # as they are on the Worker. Values never reach the log.
      - name: Set adopt-a-cell secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KOFI_VERIFICATION_TOKEN: ${{ secrets.KOFI_VERIFICATION_TOKEN }}
          DONOR_SALT: ${{ secrets.DONOR_SALT }}
        run: |
          json=$(jq -n 'env | {KOFI_VERIFICATION_TOKEN, DONOR_SALT} | with_entries(select(.value != null and .value != ""))')
          if [ "$json" = "{}" ]; then
            echo "No adopt-a-cell secrets in GitHub yet; skipping."
            exit 0
          fi
          echo "Setting: $(echo "$json" | jq -r 'keys | join(", ")')"
          echo "$json" | pnpm exec wrangler secret bulk
